name: frontend
description: BioFusion AI Flutter frontend for voice and iris identity verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  go_router: ^16.1.0
  flutter_secure_storage: ^9.2.4
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  record: ^6.2.1
  camera: ^0.11.4
  google_fonts: ^6.3.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.5
  audioplayers: ^6.1.0
  cross_file: ^0.3.4+2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

